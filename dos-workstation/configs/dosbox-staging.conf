# dosbox-staging.conf — Steam Deck DOS Workspace
#
# Deployed by setup.sh to:
#   ~/.var/app/io.github.dosbox-staging/config/dosbox/dosbox-staging.conf
#
# __HOME__ is replaced with your actual home directory during deployment.
# To edit after install, modify the deployed copy directly.

[sdl]
# Steam Deck display: 1280×800.  fullresolution=desktop fills the screen;
# aspect=true (in [render]) adds letterboxing to preserve 4:3.
fullscreen             = true
fullresolution         = desktop
windowresolution       = 1280x960
output                 = opengl
gl_bilinear_filtering  = false   # Keep pixels sharp (no blur)

# Don't grab the mouse; Steam Input handles pointer via trackpad.
autolock               = false
sensitivity            = 100

waitonerror            = true
priority               = higher,normal
usescancodes           = true

[dosbox]
language               =
# svga_s3 gives the best VESA/VGA compatibility for games and QBASIC SCREEN 13.
machine                = svga_s3
captures               = capture
memsize                = 16

[render]
frameskip              = 0
# Maintain 4:3 ratio with letterboxing on the 16:10 Steam Deck screen.
aspect                 = true
scaler                 = none
# 'sharp' shader gives clean integer-style upscaling via OpenGL.
glshader               = sharp

[cpu]
core                   = auto
cputype                = auto
# 'auto' lets DOSBox tune cycles to the running program.
# For a fixed retro feel use: cycles = fixed 25000
cycles                 = auto
cycleup                = 10
cycledown              = 20

[mixer]
nosound                = false
rate                   = 44100
blocksize              = 1024
prebuffer              = 25

[midi]
mpu401                 = intelligent
mididevice             = default
midiconfig             =

[sblaster]
# Sound Blaster 16 — compatible with the widest range of DOS games/BASIC.
sbtype                 = sb16
sbbase                 = 220
irq                    = 7
dma                    = 1
hdma                   = 5
sbmixer                = true
oplmode                = auto
oplemu                 = default
oplrate                = 44100

[gus]
gus                    = false

[speaker]
pcspeaker              = true
pcrate                 = 44100
tandy                  = off
disney                 = false

[joystick]
joysticktype           = auto
timed                  = true
autofire               = false
swap34                 = false
buttonwrap             = false

[serial]
serial1                = dummy
serial2                = dummy
serial3                = disabled
serial4                = disabled

[dos]
xms                    = true
ems                    = true
umb                    = true
keyboardlayout         = auto

[ipx]
ipx                    = false

[autoexec]
@echo off
mount C __HOME__/DOSGames
C:
echo.
echo  === DOS Workspace ===
echo  C:\GAMES     - DOS games
echo  C:\QBASIC    - QBASIC 1.1
echo  C:\GWBASIC   - GW-BASIC
echo  C:\PROJECTS  - Your programs
echo  C:\UTILS     - Utilities
echo.
