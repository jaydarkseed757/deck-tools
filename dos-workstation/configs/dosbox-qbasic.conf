# dosbox-qbasic.conf — QBASIC development environment
#
# A lean DOSBox Staging config that boots straight into QBASIC 1.1.
# Used by launch_qbasic.sh via:  flatpak run … --conf dosbox-qbasic.conf
#
# Inherits display/audio defaults but tunes CPU speed for QBASIC and
# drops directly into the IDE on startup.
#
# __HOME__ is replaced with your actual home directory during deployment.

[sdl]
fullscreen             = true
fullresolution         = desktop
windowresolution       = 1280x960
output                 = opengl
gl_bilinear_filtering  = false
autolock               = false
sensitivity            = 100
waitonerror            = true
priority               = higher,normal
usescancodes           = true

[dosbox]
machine                = svga_s3
memsize                = 16

[render]
frameskip              = 0
aspect                 = true
scaler                 = none
glshader               = sharp

[cpu]
core                   = auto
cputype                = auto
# Fixed cycles give stable, predictable QBASIC performance.
# Raise to 50000 if the editor feels sluggish.
cycles                 = fixed 25000
cycleup                = 10
cycledown              = 20

[mixer]
nosound                = false
rate                   = 44100
blocksize              = 1024
prebuffer              = 25

[midi]
mpu401                 = intelligent
mididevice             = default

[sblaster]
sbtype                 = sb16
sbbase                 = 220
irq                    = 7
dma                    = 1
hdma                   = 5
sbmixer                = true
oplmode                = auto

[gus]
gus                    = false

[speaker]
pcspeaker              = true
pcrate                 = 44100
tandy                  = off
disney                 = false

[joystick]
joysticktype           = auto

[serial]
serial1                = dummy
serial2                = dummy
serial3                = disabled
serial4                = disabled

[dos]
xms                    = true
ems                    = true
umb                    = true
keyboardlayout         = auto

[ipx]
ipx                    = false

[autoexec]
@echo off
mount C __HOME__/DOSGames
C:
CD QBASIC
if not exist QBASIC.EXE goto missing
QBASIC.EXE
goto end
:missing
echo.
echo  ERROR: QBASIC.EXE not found in C:\QBASIC\
echo  Copy QBASIC.EXE (and QBASIC.HLP) from an MS-DOS 5/6 install.
echo  (FreeDOS does not ship QBASIC.EXE itself.)
echo  Target path: __HOME__/DOSGames/QBASIC/
echo.
:end
